workflows:
  capacitor-ios:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "MeInspect Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meinspect.app
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: |
          chmod -R +x node_modules/.bin
          npm run build
      - name: Prepare iOS & CocoaPods
        script: |
          npx cap sync ios

          # Inject privacy purpose strings into Info.plist
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Injecting privacy keys into Info.plist..."
            plutil -insert NSPhotoLibraryUsageDescription -string "MeInspect requires access to your photo library to attach inspection photos to reports." "$PLIST" || plutil -replace NSPhotoLibraryUsageDescription -string "MeInspect requires access to your photo library to attach inspection photos to reports." "$PLIST"
            plutil -insert NSCameraUsageDescription -string "MeInspect requires access to your camera to take property photos during inspections." "$PLIST" || plutil -replace NSCameraUsageDescription -string "MeInspect requires access to your camera to take property photos during inspections." "$PLIST"
            plutil -insert NSLocationWhenInUseUsageDescription -string "MeInspect uses your location to verify property address locations." "$PLIST" || plutil -replace NSLocationWhenInUseUsageDescription -string "MeInspect uses your location to verify property address locations." "$PLIST"
            plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "MeInspect uses your location to verify property address locations." "$PLIST" || plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "MeInspect uses your location to verify property address locations." "$PLIST"
          fi

          cd ios/App
          if [ ! -f "Podfile" ]; then
            pod init
          fi
          pod install
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          cd ios/App
          
          # Automatically set the build number from Codemagic ($BUILD_NUMBER)
          agvtool new-version -all $BUILD_NUMBER
          
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: "MeInspect Key"
        submit_to_testflight: true