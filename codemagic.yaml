workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "MeInspect Key"
    environment:
      groups:
        - app_store_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meinspect.app
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.meinspect.app"
    scripts:
      - name: Generate iOS project & CocoaPods dependencies
        script: | 
          npm install
          chmod -R +x node_modules/.bin
          
          # Force Capacitor to generate/sync native iOS files
          npx cap add ios || true
          npx cap sync ios
# Inject required iOS location permission string into Info.plist
plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "MeInspect requires access to your location to attach location coordinates to property inspection reports." ios/App/App/Info.plist || \
plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "MeInspect requires access to your location to attach location coordinates to property inspection reports." ios/App/App/Info.plist

plutil -insert NSLocationWhenInUseUsageDescription -string "MeInspect requires access to your location to attach location coordinates to property inspection reports." ios/App/App/Info.plist || \
plutil -replace NSLocationWhenInUseUsageDescription -string "MeInspect requires access to your location to attach location coordinates to property inspection reports." ios/App/App/Info.plist

          # Force the generated Xcode project file to match com.meinspect.app
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.meinspect.app;/g' ios/App/App.xcodeproj/project.pbxproj
          
          # Navigate into iOS directory
          cd ios/App
          
          # Initialize Podfile if missing and install dependencies
          if [ ! -f "Podfile" ]; then
            pod init
          fi
          
          pod install

      - name: Set up keychain and fetch code signing certificates
        script: |
          keychain initialize
          
          # Automatically create/fetch App Store profile and Certificate from Apple Portal
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: | 
          xcode-project use-profiles

      - name: Increment build number
        script: | 
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build IPA
        script: | 
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true