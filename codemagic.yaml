workflows:
  capacitor-ios:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "MeInspect Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meinspect.app
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app and sync iOS
        script: |
          chmod -R +x node_modules/.bin
          npm run build
          npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: "MeInspect Key"
        submit_to_testflight: true