workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "MeInspect Key"
    environment:
      groups:
        - app_store_credentials
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Generate iOS project & CocoaPods dependencies
        script: | 
          npm install
          chmod -R +x node_modules/.bin
          
          # Force Capacitor to generate the native iOS structure on macOS
          npx cap add ios || true
          npx cap sync ios
          
          # Navigate into the generated iOS app folder
          cd ios/App
          
          # Ensure Podfile exists on macOS runner; initialize if missing, then install
          if [ ! -f "Podfile" ]; then
            echo "Podfile missing from Windows repo, initializing fresh Podfile on macOS runner..."
            pod init
          fi
          
          pod install
      - name: Set up code signing settings on Xcode project
        script: | 
          xcode-project use-profiles
      - name: Increment build number
        script: | 
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: | 
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true