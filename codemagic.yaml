workflows:
  capacitor-ios:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "MeInspect Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meinspect.app
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: |
          chmod -R +x node_modules/.bin
          npm run build
      - name: Prepare iOS & CocoaPods
        script: |
          # 1. Sync web assets and generate native iOS structure
          npx cap sync ios

          # 2. Navigate to iOS App directory
          cd ios/App

          # 3. If Podfile wasn't generated by cap sync, create it automatically
          if [ ! -f "Podfile" ]; then
            echo "Creating Podfile..."
            pod init
          fi

          # 4. Install CocoaPods dependencies
          pod install
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: "MeInspect Key"
        submit_to_testflight: true