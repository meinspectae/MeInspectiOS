workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "MeInspect Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meinspect.app
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.meinspect.app"
    scripts:
      - name: Build web assets and sync Capacitor
        script: | 
          npm install
          chmod -R +x node_modules/.bin || true
          
          # 1. Compile fresh web assets
          npm run build

          # 2. Sync native iOS project
          npx cap add ios || true
          npx cap sync ios

          # 3. Install CocoaPods dependencies for Capacitor plugins
          cd ios/App && pod install && cd ../..

          # 4. Safe plist injection
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO ios/App/App/Info.plist || true
          plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "MeInspect requires access to your location to attach location coordinates to property inspection reports." ios/App/App/Info.plist || true
          plutil -replace NSLocationWhenInUseUsageDescription -string "MeInspect requires access to your location to attach location coordinates to property inspection reports." ios/App/App/Info.plist || true

          # 5. Set bundle ID
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.meinspect.app;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Set up code signing settings on Xcode project
        script: | 
          xcode-project use-profiles

      - name: Increment build number
        script: | 
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build IPA
        script: | 
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true