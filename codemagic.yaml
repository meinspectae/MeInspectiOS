workflows:
  ios-release:
    name: iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.meinspect.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Ensure Export Compliance and Info.plist Settings
        script: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            plutil -replace ITSAppUsesNonExemptEncryption -bool false "$PLIST"
          fi
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Set up code signing settings
        script: |
          # Codemagic automatic code signing configuration hooks
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_DISTRIBUTION --create
      - name: Build IPA for App Store
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme App \
            -archivePath "$CM_BUILD_DIR/ios/App/build/ios/xcarchive/App.xcarchive" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE="Manual"

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/ios/App/build/ios/xcarchive/App.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/ios/App/exportOptions.plist" \
            -exportPath "$CM_BUILD_DIR/ios/App/build/ios/ipa"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Optional explicit beta group routing if configured in App Store Connect
        beta_groups:
          - "Internal Group"