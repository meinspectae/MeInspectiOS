workflows:
  capacitor-ios:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "MeInspect Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meinspect.app
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app and sync iOS
        script: |
          chmod -R +x node_modules/.bin
          npm run build
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          POD_DIR=$(find . -maxdepth 4 -name "Podfile" -exec dirname {} \; | head -n 1)
          if [ -z "$POD_DIR" ]; then
            echo "ERROR: Podfile not found anywhere in repo! Listing directory contents:"
            ls -la
            ls -la ios || true
            exit 1
          fi
          echo "Found Podfile in: $POD_DIR"
          cd "$POD_DIR"
          pod install
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          WORKSPACE_PATH=$(find . -maxdepth 4 -name "*.xcworkspace" | head -n 1)
          WORKSPACE_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORKSPACE_DIR"
          xcode-project build-ipa --workspace "$(basename "$WORKSPACE_PATH")" --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - "**/build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        api_key: "MeInspect Key"
        submit_to_testflight: true