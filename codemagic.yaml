workflows:
  capacitor-ios:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "MeInspect Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meinspect.app
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app and sync iOS
        script: |
          chmod -R +x node_modules/.bin
          npm run build
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          PODFILE_DIR=$(find ios -name "Podfile" -exec dirname {} \;)
          echo "Found Podfile in: $PODFILE_DIR"
          cd "$PODFILE_DIR" && pod install
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" | head -n 1)
          WORKSPACE_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORKSPACE_DIR"
          xcode-project build-ipa --workspace "$(basename "$WORKSPACE_PATH")" --scheme "App"
    artifacts:
      - ios/**/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: "MeInspect Key"
        submit_to_testflight: true