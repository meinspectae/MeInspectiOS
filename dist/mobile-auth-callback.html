<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Return to MeInspect</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font: 16px system-ui, sans-serif; }
      main { text-align: center; padding: 24px; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 12px; background: #2563eb; color: #fff; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign-in complete</h1>
      <p>Return to MeInspect to continue.</p>
      <a id="open-app" href="meinspect://auth/callback">Open MeInspect</a>
    </main>
    <script>
      const input = new URL(window.location.href);
      const output = new URL('meinspect://auth/callback');
      for (const key of ['es_auth_token', 'error', 'error_description']) {
        const value = input.searchParams.get(key);
        if (value) output.searchParams.set(key, value);
      }
      const target = output.toString();
      document.getElementById('open-app').href = target;
      window.location.replace(target);
    </script>
  </body>
</html>
