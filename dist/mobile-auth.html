<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Continue with Google — MeInspect</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font: 16px system-ui, sans-serif; }
      main { width: min(88vw, 360px); text-align: center; }
      .spinner { width: 38px; height: 38px; margin: 0 auto 20px; border: 4px solid #bfdbfe; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
      p { color: #64748b; line-height: 1.5; }
      .error { color: #b91c1c; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Opening Google sign-in</h1>
      <p id="status">Please wait…</p>
    </main>
    <script>
      (async function () {
        const backendUrl = 'https://olkmxpl1sliijytnc48w.youbase.cloud';
        const callbackURL = 'https://app.meinspect.com/mobile-auth-callback.html';
        const status = document.getElementById('status');
        try {
          const response = await fetch(backendUrl + '/api/_es/auth/sign-in/social', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider: 'google', callbackURL, disableRedirect: true })
          });
          const result = await response.json();
          if (!response.ok || !result.url) throw new Error(result.message || 'Unable to start Google sign-in');

          // On updated YouBase workers this re-issues the short-lived OAuth state
          // cookie as Secure + SameSite=None. Older workers return 404, and the
          // normal top-level SameSite=Lax callback remains the safe fallback.
          await fetch(backendUrl + '/api/public/mobile-auth/secure-state', {
            method: 'POST',
            credentials: 'include'
          }).catch(() => undefined);

          window.location.replace(result.url);
        } catch (error) {
          document.querySelector('.spinner')?.remove();
          status.className = 'error';
          status.textContent = error instanceof Error ? error.message : 'Google sign-in could not be started.';
        }
      })();
    </script>
  </body>
</html>
